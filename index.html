<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二上國語｜互動複習書櫃</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
:root{--bg:#fff8ef;--ink:#3b2a1e;--muted:#8a7360;--wood:#b9824f;--wood-d:#8a5a32;--wood-l:#d9a874}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC",serif}
header{text-align:center;padding:22px 16px 6px}
header h1{margin:0;font-size:32px;letter-spacing:3px;color:#c4521b}
header p{margin:4px 0 0;color:var(--muted);font-size:18px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px auto 4px;max-width:720px}
.stat{background:#fff;border:2px solid #f2b134;border-radius:16px;padding:6px 16px;display:flex;align-items:center;gap:8px;font-size:18px}
.stat b{font-size:26px;color:#e8692c}
.case{max-width:980px;margin:18px auto 30px;padding:0 12px}
.cabinet{background:linear-gradient(var(--wood),var(--wood-d));border-radius:18px;padding:10px 10px 14px;box-shadow:0 10px 30px rgba(90,50,20,.25),inset 0 0 0 6px var(--wood-d)}
.shelf{display:flex;flex-wrap:wrap;justify-content:center;padding:6px 0 0}
.slot{width:124px;padding:14px 10px 0;position:relative;display:flex;justify-content:center}
.slot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(var(--wood-l),var(--wood));box-shadow:0 4px 0 var(--wood-d)}
.book{position:relative;z-index:1;flex:0 0 auto;width:104px;height:180px;margin-bottom:16px;border-radius:6px 12px 12px 6px;color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 6px 10px;
  box-shadow:inset 8px 0 0 rgba(0,0,0,.18),inset 10px 0 0 rgba(255,255,255,.15),0 4px 8px rgba(0,0,0,.25);transition:transform .2s}
.book:hover{transform:translateY(-10px) rotate(-1.5deg)}
.book .no{font-size:15px;background:rgba(255,255,255,.25);border-radius:999px;padding:0 10px}
.book .em{font-size:40px;line-height:1}
.book .tt{font-size:18px;font-weight:700;text-align:center;line-height:1.25;writing-mode:horizontal-tb}
.book .tr{font-size:14px;background:rgba(0,0,0,.18);border-radius:8px;padding:0 6px;min-height:20px}
.book.off{filter:grayscale(.85);opacity:.55;cursor:default}
.book.off:hover{transform:none}
.book .lock{font-size:13px;background:#fff;color:var(--muted);border-radius:8px;padding:0 6px}
.tip{text-align:center;color:var(--muted);font-size:16px;margin:10px 0 0}
</style>
</head>
<body>
<header>
  <h1>📚 國語互動複習書櫃</h1>
  <p>二年級上學期・點一本書，開始闖關！</p>
  <div class="stats">
    <div class="stat">🏆 獎盃 <b id="sT">0</b></div>
    <div class="stat">📅 練習 <b id="sD">0</b> 天</div>
    <div class="stat">🔥 連續 <b id="sS">0</b> 天</div>
  </div>
</header>
<div class="case"><div class="cabinet" id="cab"></div>
  <p class="tip">灰色的書還在準備中，老師教完就會放上書櫃！</p>
</div>
<script>
// ready:true 的課才會打開；新增一課時，把 ready 改成 true，並放上 Lx/index.html
const BOOKS=[
 {id:'L1',n:'第一課',t:'新學年新希望',e:'🎒',c:'#e57373'},
 {id:'L2',n:'第二課',t:'一起做早餐',e:'🍳',c:'#f2a541'},
 {id:'L3',n:'第三課',t:'走過小巷',e:'🏘️',c:'#7cb36b'},
 {id:'L4',n:'第四課',t:'運動會',e:'🏃',c:'#4fa3c7'},
 {id:'L5',n:'第五課',t:'坐竹籃船',e:'🛶',c:'#9b7bd1'},
 {id:'L6',n:'第六課',t:'小鎮的柿餅節',e:'🍊',c:'#e8692c',ready:true},
 {id:'L7',n:'第七課',t:'國王的新衣裳',e:'👑',c:'#3d7fc4',ready:true},
 {id:'L8',n:'第八課',t:'「聰明」的小熊',e:'🐻',c:'#8d6e63'},
 {id:'L9',n:'第九課',t:'大象有多重？',e:'🐘',c:'#78909c'},
 {id:'L10',n:'第十課',t:'新年快樂',e:'🧧',c:'#d64545'},
 {id:'L11',n:'第十一課',t:'遠方來的黑皮',e:'🐕',c:'#5d8a4f'},
 {id:'L12',n:'第十二課',t:'我愛冬天',e:'⛄',c:'#5c9ccc'},
];
let LOG=[];try{LOG=JSON.parse(localStorage.getItem('zh-log'))||[];}catch(e){}
try{if(!LOG.length){const old=JSON.parse(localStorage.getItem('l6-log')||'[]');LOG=old.map(r=>({...r,L:'L6'}));}}catch(e){}
const pad=n=>String(n).padStart(2,'0');
const dstr=t=>{const d=new Date(t);return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;};
const days=new Set(LOG.map(r=>dstr(r.t)));
let streak=0;{const d=new Date();if(!days.has(dstr(d)))d.setDate(d.getDate()-1);while(days.has(dstr(d))){streak++;d.setDate(d.getDate()-1);}}
document.getElementById('sT').textContent=LOG.filter(r=>r.pass).length;
document.getElementById('sD').textContent=days.size;
document.getElementById('sS').textContent=streak;
const cab=document.getElementById('cab');
const sh=document.createElement('div');sh.className='shelf';
BOOKS.forEach(b=>{
  const tro=LOG.filter(r=>r.pass&&(r.L||'L6')===b.id).length;
  const slot=document.createElement('div');slot.className='slot';
  const el=document.createElement(b.ready?'a':'div');
  el.className='book'+(b.ready?'':' off');el.style.background=b.c;
  if(b.ready)el.href=b.id+'/index.html';
  el.innerHTML=`<span class="no">${b.n}</span><span class="em">${b.e}</span><span class="tt">${b.t}</span>`+
    (b.ready?`<span class="tr">${tro?'🏆×'+tro:'開始闖關'}</span>`:'<span class="lock">🔒 準備中</span>');
  slot.appendChild(el);sh.appendChild(slot);
});
cab.appendChild(sh);
</script>
</body>
</html>
